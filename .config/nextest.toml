# nextest 配置
# 文档: https://nexte.st/docs/configuration/

[profile.default]
# 单个测试超时 60s 警告，2 次后 kill
slow-timeout = { period = "60s", terminate-after = 2 }

# CI profile：启用重试 + JUnit 输出
[profile.ci]
slow-timeout = { period = "120s", terminate-after = 2 }
retries = 2
fail-fast = false

[profile.ci.junit]
path = "junit.xml"

# 资源敏感测试组：限制并发
# 用法：将测试用 #[test_group(...)] 或 override 归入下方组
# [test-groups.database]
# max-threads = 4
#
# [[profile.default.overrides]]
# filter = "package(my-infra-postgresql)"
# test-group = "database"
